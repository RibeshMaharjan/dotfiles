[terminal]
[terminal.shell]
program="/usr/bin/fish"

# JetBrain Mono
[font]
size = 11.0

[font.normal]
family = "JetBrains Mono"
style = "SemiBold"

[font.bold]
family = "JetBrains Mono"
style = "ExtraBold"

[font.italic]
family = "JetBrains Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrains Mono"
style = "Bold Italic"


