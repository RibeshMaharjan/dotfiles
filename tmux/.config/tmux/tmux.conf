# reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# use fish by default
set -g default-shell /usr/bin/fish
set -g base-index 1
set -g mouse on
set -g renumber-windows on
set-option -g status-position top
# set-window-option -g automatic-rename off

# Catppuccin v2 configuration
set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_fill "number"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text " #W" 
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text " #W"

# Status line styling
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

# Build the status line with catppuccin modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory} #{E:@catppuccin_status_session}"

# Or use the full module builder
# set -g @catppuccin_status_modules_right "directory session"

# List of plugins
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Optional: Automatic restore on tmux start
set -g @continuum-restore 'on'
set -g extended-keys on

# Initialize TPM
run '~/.config/tmux/plugins/tpm/tpm'
